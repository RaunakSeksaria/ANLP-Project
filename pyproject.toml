[project]
name = "anlp-project"
version = "0.1.0"
description = "Event-aware representation learning for neutral news rewriting: data generation, LED training, embedding and generation evaluation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.24.0",
    "huggingface-hub>=0.25",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.2.3",
    "requests>=2.31",
    "scikit-learn>=1.9.0",
    "scipy>=1.11",
    "torch>=2.5",
    "tqdm>=4.66",
    "transformers>=4.40",
]

[project.optional-dependencies]
tracking = ["wandb>=0.19"]
dev = ["pytest>=8", "wandb>=0.19"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
